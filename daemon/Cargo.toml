[package]
name = "pop-system-updater"
version = "0.2.0"
authors = ["Michael Aaron Murphy <michael@mmurphy.dev>"]
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
anyhow = "1.0.104"
apt-cmd = "0.6.1"
as-result = "0.2.1"
async-cron-scheduler = { path = "../scheduler", features = ["logging"] }
async-fetcher = "0.12.1"
async-stream = "0.3.6"
bytesize = "2.7.0"
chrono = "0.4.45"
enumflags2 = "0.7.12"
flume = "0.12.0"
fork = "0.11.0"
futures = "0.3.34"
libc = "0.2.191"
notify-rust = { version = "4.18.2", default-features = false, features = [
    "zbus",
    "serde",
    "tokio",
] }
os-release = "0.1.0"
pop-system-updater-zbus = { path = "../client" }
reqwest = "0.13.5"
ron = "0.12.3"
rustix = "1.1.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_repr = "0.1.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
users = "0.11.0"
whitespace-conf = "1.0.0"
zbus = { version = "6.2.0", default-features = false, features = ["tokio"] }

[dependencies.tokio]
version = "1.54.1"
features = ["full"]

[features]
